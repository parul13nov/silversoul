<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSJ Calculator</title>
    <!-- Author -->
    <meta name="author" content="Silversoul">
    <!-- Favicon / browser icon -->
    <link rel="icon" type="image/png" href="logos/silversoul.jpg">
    <!-- Apple device icon -->
    <link rel="apple-touch-icon" href="logos/silversoul.jpg">
    
    <!-- <link rel="manifest" href="/site.webmanifest">


    <meta property="og:title" content="silversoul Jewellery - 925 Sterling Silver">

    <meta
        property="og:description"
        content="Explore our products and services. We provide high-quality 925 Sterling Silver products for individuals."
    >

    <meta property="og:image" content="https://res.cloudinary.com/yyq4gkzy/image/upload/v1790762318/silversoul.jpg">

    <meta property="og:site_name" content="silversoul Jewellery"> -->


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .calculator {
            max-width: 450px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #555;
        }

        /* Brand Heading */
        .brand-heading {
            text-align: center;
            margin: 0 0 13px 0;
            color: #113b7a;
            font-size: 32px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .gst-box {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .result {
            margin-top: 20px;
            background: #f7f7f7;
            border-radius: 10px;
            padding: 18px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #16803c;
            padding-top: 15px;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #555;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #333;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
        .btn {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            text-align: center;
            text-decoration: none;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            background-color: transparent;
            transition: color 0.15s ease-in-out,
                        background-color 0.15s ease-in-out,
                        border-color 0.15s ease-in-out,
                        box-shadow 0.15s ease-in-out;
            }

        .btn-success {
            width: 100%;
            color: #fff;
            background-color: #198754;
            border-color: #198754;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="calculator">
        <!-- Brand Name -->
        <a href="index.html" style="text-decoration: none;" ><h1 class="brand-heading">SILVERSOUL</h1></a>


    <!-- <h2>Silver Amount Calculator</h2> -->

    <div class="form-group">
        <label for="silverRate">Silver Rate (₹ / gram)</label>
        <input type="number" id="silverRate" placeholder="Enter silver rate" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="weight">Weight (grams)</label>
        <input type="number" id="weight" placeholder="Enter weight" min="0" step="0.001">
    </div>

    <div class="form-group">
        <label for="making">Making Charges (₹ / gram)</label>
        <input type="number" id="making" placeholder="Enter making charges" min="0" step="0.01">
    </div>

    <div class="gst-box">
        <span>GST</span>
        <strong>3%</strong>
    </div>
    <div class="result">

        <div class="result-row">
            <span>Silver Value</span>
            <strong id="silverValue">₹0.00</strong>
        </div>

        <div class="result-row">
            <span>Total Making </span>
            <strong id="makingValue">₹0.00</strong>
        </div>

        <div class="result-row">
            <span>Subtotal</span>
            <strong id="subtotal">₹0.00</strong>
        </div>

        <div class="result-row">
            <span>GST (3%)</span>
            <strong id="gstAmount">₹0.00</strong>
        </div>

        <div class="result-row total">
            <span>Final Amount</span>
            <strong id="finalAmount">₹0.00</strong>
        </div>

    </div>

    <button class="clear-btn" id="clearBtn">Clear</button>

</div>


<script>
$(document).ready(function () {

    const GST_RATE = 3;

    function calculateAmount() {

        let silverRate = parseFloat($("#silverRate").val()) || 0;
        let weight = parseFloat($("#weight").val()) || 0;
        let making = parseFloat($("#making").val()) || 0;

        // Silver value
        let silverValue = silverRate * weight;

        // Silver Making
        let silverMaking = silverRate + making;

        // Weight Making
        let totalMaking = making * weight;

        // Subtotal before GST
        let subtotal = silverMaking * weight;

        // GST 3%
        let gstAmount = subtotal * GST_RATE / 100;

        // Final amount
        let finalAmount = subtotal + gstAmount;
        // Display values
        $("#silverValue").text("₹" + silverValue.toFixed(2));
        $("#makingValue").text("₹" + totalMaking.toFixed(2));
        $("#subtotal").text("₹" + subtotal.toFixed(2));
        $("#gstAmount").text("₹" + gstAmount.toFixed(2));
        $("#finalAmount").text("₹" + finalAmount.toFixed(2));
    }

    // Calculate whenever user changes an input
    $("#silverRate, #weight, #making").on("input", function () {
        calculateAmount();
    });

    // Clear button
    $("#clearBtn").click(function () {

        $("#silverRate").val("");
        $("#weight").val("");
        $("#making").val("");

        $("#silverValue").text("₹0.00");
        $("#makingValue").text("₹0.00");
        $("#subtotal").text("₹0.00");
        $("#gstAmount").text("₹0.00");
        $("#finalAmount").text("₹0.00");
    });

});
</script>

</body>
</html>
